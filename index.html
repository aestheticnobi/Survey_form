<!doctype html>
<html class="no-js" lang="">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Survey</title>
  <link rel="stylesheet" href="css/style.css">
  <meta name="description" content="">

  <meta property="og:title" content="">
  <meta property="og:type" content="">
  <meta property="og:url" content="">

  <link rel="apple-touch-icon" href="icon.png">

  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#fafafa">

</head>

<body>

  <h3>Please input your details in the appropriate boxes.</h3>
  <form>
    <label>First Name:</label>
     <input type="text" name="fName"><br>

    <br><label> Last Name:</label>
    <input type="text" name="laName"><br>

    <br><label>Phone Number:</label>
    <input type="number" name="pnumber"><br>

    <label>Gender</label><br>
    <input type="radio" name="gender" value="Female">
    <label>Female</label><br>

    <input type="radio" name="gender" value="Male">
    <label>Male</label><br>

    <input type="radio" name="gender" value="nonebi">
    <label>Prefer not to say</label><br>

    <label>Address</label>
    <input type="text" name="Address"><br>

    <br><label>Email</label>
    <input type="email" name="Email"><br>



    <LABEL>How long have you been using the product?</LABEL><br>
    <input type="radio" name="usage" value="weekly">
    <label>Less than a week</label><br>

    <input type="radio" name="usage" value="month1" >
    <label>1-6 months</label><br>

    <input type="radio" name="usage" value="month2">
    <label>6-12 months</label><br>
    <p>Please tell us why you enjoy using our app and what we need to improve</p>
    <textarea></textarea>

    <br><label>Submit</label>
    <input type="submit" name="submit"><br>
  </form>

</body>

</html>
